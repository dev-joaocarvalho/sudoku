name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Gerar ícone e splash do app
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sincronizar projeto web com o Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sudoku.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-apk
          path: sudoku.apk

      - name: Publicar APK na página de Releases (apenas quando houver tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sudoku.apk
          generate_release_notes: true
